<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Barathon Caennais — Carnet de route</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b1d0e;
    --ink-soft: #5b4632;
    --paper: #ece0c0;
    --paper-card: #f8f1dc;
    --wine: #7a2333;
    --wine-light: #9c3449;
    --brass: #a9822d;
    --brass-light: #d4ab5c;
    --moss: #3e5b44;
    --slate: #8b8171;
    --radius-sm: 5px;
    --radius-md: 9px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px rgba(43,29,14,.10), 0 1px 1px rgba(43,29,14,.06);
    --shadow-md: 0 6px 16px rgba(43,29,14,.16), 0 2px 4px rgba(43,29,14,.08);
    --shadow-lg: 0 20px 48px rgba(20,14,7,.35), 0 4px 12px rgba(43,29,14,.14);
    --ease: cubic-bezier(.22,.9,.32,1);
  }
  * { box-sizing: border-box; }
  @keyframes shimmer { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }
  @keyframes fade-in-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes confetti-fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(540deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
  body {
    margin: 0; min-height: 100vh; padding: 12px 10px 24px;
    color: var(--ink);
    font-family: 'Special Elite', 'Courier New', monospace;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(43,29,14,.12), transparent 55%);
    background-attachment: fixed;
  }
  
  /* BANDEAU RÉSEAU */
  #net-banner {
    max-width: 440px; margin: 0 auto 8px; padding: 4px 10px; font-size: 11px; text-align: center;
    border-radius: 3px; font-weight: bold; transition: all .3s; display: none;
  }
  .net-offline { background: var(--wine); color: #fff; display: block !important; }
  .net-online { background: var(--moss); color: #fff; }

  .container {
    position: relative; max-width: 440px; margin: 0 auto;
    background: var(--paper-card);
    border: 1px solid rgba(43,29,14,.35);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg), inset 0 0 40px rgba(169,130,45,.06);
    padding: 20px 18px 22px;
    overflow: hidden;
    animation: fade-in-up .5s var(--ease);
  }

  /* BARRE DE PROGRESSION */
  #progress-wrap { margin: 2px 0 16px; }
  #progress-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-soft); margin-bottom: 5px; letter-spacing: .3px; }
  #progress-track { height: 8px; border-radius: 10px; background: rgba(43,29,14,.12); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.1); }
  #progress-fill { height: 100%; width: 0%; border-radius: 10px; background: linear-gradient(90deg, var(--brass), var(--wine-light)); transition: width .6s var(--ease); box-shadow: 0 0 8px rgba(169,130,45,.5); }
  .container::after {
    content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0;
    border-style: solid; border-width: 0 28px 28px 0;
    border-color: transparent rgba(43,29,14,.2) transparent transparent;
  }
  .brand-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 2px; cursor: pointer; user-select: none; }
  .brand-row svg { color: var(--wine); flex-shrink: 0; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  h1 { font-family: 'IM Fell English SC', serif; font-size: 26px; margin: 0; text-align: center; letter-spacing: .5px; text-shadow: 1px 1px 0 rgba(169,130,45,.2); }
  .tagline { text-align: center; font-style: italic; color: var(--ink-soft); font-size: 12.5px; margin: 6px 0 16px; line-height: 1.4; }

  .ledger-line { background: rgba(255,253,246,.7); border: 1px solid rgba(43,29,14,.18); border-radius: var(--radius-md); padding: 11px 14px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  .ledger-line label { display: block; font-size: 12.5px; margin-bottom: 5px; color: var(--ink-soft); }
  select, input[type="text"] {
    width: 100%; padding: 9px; font-family: inherit; font-size: 13.5px;
    border: 1px solid rgba(43,29,14,.4); border-radius: 3px; background: #fffdf6; color: var(--ink);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.06);
  }
  #global-participant { border: none; border-bottom: 2px solid var(--ink); border-radius: 0; background: transparent; padding: 6px 2px; font-weight: bold; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; padding: 4px; background: rgba(43,29,14,.07); border-radius: var(--radius-md); box-shadow: inset 0 1px 3px rgba(0,0,0,.08); }
  .tab-btn { flex: 1; background: none; border: none; padding: 9px 4px; font-family: 'Special Elite', monospace; font-size: 13px; color: var(--ink-soft); cursor: pointer; border-radius: 6px; transition: all .22s var(--ease); }
  .tab-btn.active { color: #fdf6e8; font-weight: bold; background: linear-gradient(180deg, var(--wine-light), var(--wine)); box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.18); }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fade-in-up .3s var(--ease); }

  .trail { display: flex; flex-direction: column; }
  .waypoint { display: flex; align-items: center; gap: 10px; background: #fffdf6; border: 1px solid rgba(43,29,14,.25); border-left: 5px solid var(--slate); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 9px; box-shadow: var(--shadow-sm); transition: transform .12s var(--ease), box-shadow .12s var(--ease); opacity: 0; animation: fade-in-up .35s var(--ease) forwards; }
  .waypoint.open { border-left-color: var(--moss); cursor: pointer; }
  .waypoint.open:active { transform: translateY(1px) scale(.995); box-shadow: var(--shadow-sm); }
  .waypoint.locked { filter: blur(2px); opacity: .5 !important; pointer-events: none; user-select: none; animation: none; }

  .skeleton-row { height: 56px; border-radius: var(--radius-sm); margin-bottom: 9px; background: linear-gradient(90deg, #ece0c6 25%, #f6eed6 37%, #ece0c6 63%); background-size: 400px 100%; animation: shimmer 1.4s infinite linear; }
  .skeleton-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #ece0c6 25%, #f6eed6 37%, #ece0c6 63%); background-size: 400px 100%; animation: shimmer 1.4s infinite linear; }

  .seal { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'IM Fell English SC', serif; font-size: 15px; background: radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass)); border: 1px solid rgba(43,29,14,.4); color: var(--ink); box-shadow: 0 2px 5px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 3px rgba(43,29,14,.18); }
  .seal-locked { background: var(--slate); color: #fff; }

  .waypoint-info { flex: 1; min-width: 0; }
  .waypoint-info strong { display: block; font-family: 'IM Fell English SC', serif; font-size: 15px; }
  .waypoint-info small { color: var(--ink-soft); font-size: 11px; }

  .status { font-size: 10.5px; font-weight: bold; white-space: nowrap; }
  .status-open { color: var(--moss); }
  .status-locked { color: var(--slate); }

  .unlock-call { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #fffdf6 0%, #f6ecd0 100%); border: 1.5px solid var(--wine); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 11px; cursor: pointer; text-align: left; animation: seal-pulse 2s infinite, fade-in-up .35s var(--ease) both; box-shadow: var(--shadow-md); transition: transform .12s var(--ease); }
  .unlock-call:active { transform: scale(.985); }
  .unlock-icon { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fdf6e8; background: linear-gradient(135deg, var(--wine-light), var(--wine)); box-shadow: 0 2px 6px rgba(122,35,51,.4), inset 0 1px 0 rgba(255,255,255,.25); }
  .unlock-text { flex: 1; min-width: 0; }
  .unlock-text strong { display: block; font-family: 'IM Fell English SC', serif; font-size: 15.5px; color: var(--wine); margin-bottom: 2px; }
  .unlock-text small { color: var(--ink-soft); font-size: 11.5px; line-height: 1.3; display: block; }
  .unlock-chevron { font-size: 26px; color: var(--wine); line-height: 1; opacity: .7; }
  @keyframes seal-pulse { 0% { box-shadow: 0 0 0 0 rgba(122,35,51,.35); } 70% { box-shadow: 0 0 0 12px rgba(122,35,51,0); } 100% { box-shadow: 0 0 0 0 rgba(122,35,51,0); } }
  @media (prefers-reduced-motion: reduce) { .unlock-call { animation: none; } }

  .ledger-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 4px; font-size: 12.5px; border: 1px solid rgba(43,29,14,.3); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .ledger-table th, .ledger-table td { border-bottom: 1px solid rgba(43,29,14,.12); padding: 10px 8px; text-align: center; }
  .ledger-table tbody tr:last-child td { border-bottom: none; }
  .ledger-table th { background: var(--ink); color: var(--paper-card); font-weight: normal; font-family: 'IM Fell English SC', serif; font-size: 14px; }
  .ledger-table tbody tr:nth-child(even) { background: rgba(43,29,14,.04); }

  .medal { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-family: 'IM Fell English SC', serif; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .medal-gold { background: var(--brass); color: var(--ink); }
  .medal-silver { background: #b9b2a0; color: var(--ink); }
  .medal-bronze { background: #9c6b3e; color: #fff; }

  /* TOAST NOTIFICATION STYLISÉ */
  #toast-container { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; width: 92%; max-width: 380px; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 10px; background: rgba(43,29,14,.96); color: var(--paper-card); padding: 11px 14px; border-radius: var(--radius-md); font-size: 12.5px; text-align: left; border: 1px solid var(--brass); box-shadow: var(--shadow-lg); animation: toast-in .35s var(--ease); pointer-events: auto; backdrop-filter: blur(6px); }
  .toast-icon { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; background: var(--brass); color: var(--ink); }
  .toast-good .toast-icon { background: var(--moss); color: #fff; }
  .toast-bad .toast-icon { background: var(--wine-light); color: #fff; }
  .toast.leaving { opacity: 0; transform: translateY(8px); transition: all .25s var(--ease); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* MODALES */
  .modal { display: none; position: fixed; inset: 0; background: rgba(20,14,7,.0); backdrop-filter: blur(0px); z-index: 100; align-items: center; justify-content: center; padding: 16px; transition: background .28s var(--ease), backdrop-filter .28s var(--ease); }
  .modal.is-open { background: rgba(20,14,7,.78); backdrop-filter: blur(4px); }
  .modal-content { background: var(--paper-card); border: 1px solid var(--brass); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg), inset 0 0 50px rgba(169,130,45,.10); padding: 22px 20px 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; text-align: center; position: relative; opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .28s var(--ease), transform .32s var(--ease); scrollbar-width: thin; scrollbar-color: var(--brass) transparent; }
  .modal.is-open .modal-content { opacity: 1; transform: translateY(0) scale(1); }
  .modal-content::before, .modal-content::after { content: "§"; position: absolute; top: 8px; font-family: 'IM Fell English SC', serif; color: var(--brass); opacity: .4; font-size: 16px; }
  .modal-content::before { left: 12px; }
  .modal-content::after { right: 12px; }
  .modal-content h3 { font-family: 'IM Fell English SC', serif; font-size: 19px; margin: 0 0 14px; color: var(--wine); border-bottom: 1px solid rgba(169,130,45,.4); padding-bottom: 8px; }

  .file-label { display: block; font-size: 12.5px; margin: 10px 0 5px; color: var(--ink-soft); text-align: left; }
  .btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: var(--radius-md); border: 1px solid var(--ink); font-family: 'Special Elite', monospace; font-size: 13.5px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s; position: relative; overflow: hidden; }
  .btn:active { transform: translateY(1px) scale(.99); box-shadow: none; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(180deg, var(--wine-light) 0%, var(--wine) 100%); border-color: #5a1824; color: #fdf6e8; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,.3); box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.18); }
  .btn-primary::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent); transform: skewX(-20deg); animation: btn-shine 4.5s infinite; }
  @keyframes btn-shine { 0%, 70% { left: -60%; } 100% { left: 130%; } }
  .btn-ghost { background: transparent; color: var(--ink-soft); border-color: rgba(43,29,14,.3); box-shadow: none; }

  .feedback { margin-top: 10px; font-weight: bold; font-size: 12.5px; min-height: 18px; }
  .feedback-good { color: var(--moss); }
  .feedback-bad { color: var(--wine); }
  .feedback-info { color: #345066; }
  .feedback-warn { color: #8a6a1e; }

  /* ÉPREUVE MOTUS */
  .motus-grid { display: flex; gap: 5px; justify-content: center; margin: 12px 0; }
  .motus-tile { width: 32px; height: 32px; border: 2px solid var(--ink); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase; font-size: 14px; box-shadow: 0 2px 3px rgba(0,0,0,.15); }
  .m-correct { background: var(--moss); color: #fff; border-color: #26382a; }
  .m-present { background: #d4a017; color: var(--ink); border-color: #9c730e; }
  .m-absent { background: var(--slate); color: #fff; border-color: #5c5549; }

  /* ÉPREUVE BOUSSOLE */
  /* INSTRUMENT BOUSSOLE */
  .compass-instrument { position: relative; width: 100%; max-width: 250px; margin: 6px auto 4px; filter: drop-shadow(0 12px 14px rgba(43,29,14,.38)); }
  .compass-instrument svg { display: block; width: 100%; height: auto; position: relative; z-index: 2; }
  .compass-glow { position: absolute; inset: 3%; border-radius: 50%; pointer-events: none; opacity: 0; z-index: 1; transition: opacity .5s; }
  .compass-ping { position: absolute; inset: 2%; border-radius: 50%; border: 2px solid rgba(169,130,45,.0); pointer-events: none; z-index: 1; opacity: 0; }
  .compass-ping.p2 { animation-delay: .9s !important; }
  .compass-instrument[data-heat="1"] .compass-glow { opacity: 1; box-shadow: 0 0 26px 8px rgba(212,171,92,.55); animation: glow-pulse 2.4s ease-in-out infinite; }
  .compass-instrument[data-heat="2"] .compass-glow { opacity: 1; box-shadow: 0 0 30px 10px rgba(178,56,80,.6); animation: glow-pulse 1.3s ease-in-out infinite; }
  .compass-instrument[data-heat="3"] .compass-glow { opacity: 1; box-shadow: 0 0 36px 14px rgba(255,216,128,.9); animation: glow-pulse .7s ease-in-out infinite; }
  .compass-instrument[data-heat="2"] .compass-ping, .compass-instrument[data-heat="3"] .compass-ping { animation: radar-ping 1.8s ease-out infinite; }
  .compass-instrument[data-heat="3"] .compass-ping { animation-duration: 1s; border-color: rgba(255,216,128,.9); }
  @keyframes glow-pulse { 0%, 100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.035); opacity: 1; } }
  @keyframes radar-ping { 0% { transform: scale(1); opacity: .85; border-color: rgba(178,56,80,.8); } 100% { transform: scale(1.32); opacity: 0; border-color: rgba(178,56,80,0); } }
  #compass-rose, #compass-needle, #compass-sweep, .needle-wobble { transform-box: view-box; transform-origin: 130px 130px; }
  #compass-rose { transition: transform .35s ease-out; }
  #compass-needle { transition: transform .4s cubic-bezier(.3,1.4,.5,1); }
  #compass-sweep { animation: radar-sweep 5s linear infinite; opacity: .55; }
  .compass-instrument.standby #compass-sweep { opacity: 0; animation-play-state: paused; }
  .compass-instrument.standby .needle-wobble { animation: needle-idle 3.4s ease-in-out infinite; }
  @keyframes radar-sweep { to { transform: rotate(360deg); } }
  @keyframes needle-idle { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(20deg); } }

  .compass-readout { margin: 8px auto 0; padding: 9px 14px 8px; max-width: 250px; border-radius: var(--radius-md); background: linear-gradient(180deg, #2f2113 0%, #1f160c 100%); border: 1.5px solid var(--brass); box-shadow: inset 0 2px 8px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35), var(--shadow-sm); }
  .ro-label { font-size: 9.5px; letter-spacing: 1.6px; color: #b79b62; }
  .ro-value { font-family: 'IM Fell English SC', serif; font-size: 34px; line-height: 1.05; color: var(--brass-light); text-shadow: 0 0 12px rgba(212,171,92,.55); }
  .ro-unit { font-size: 16px; margin-left: 4px; opacity: .8; }
  .compass-instrument[data-heat="2"] ~ .compass-readout .ro-value { color: #ffb3a0; text-shadow: 0 0 14px rgba(255,120,100,.7); }
  .compass-instrument[data-heat="3"] ~ .compass-readout .ro-value { color: #fff1c4; text-shadow: 0 0 16px rgba(255,226,140,.95); }

  .heat-meter { display: flex; gap: 3px; max-width: 250px; margin: 10px auto 0; padding: 4px; background: rgba(43,29,14,.12); border-radius: 7px; box-shadow: inset 0 1px 3px rgba(0,0,0,.18); }
  .heat-meter i { flex: 1; height: 11px; border-radius: 3px; opacity: .22; transition: opacity .3s, box-shadow .3s; }
  .heat-meter i.lit { opacity: 1; box-shadow: 0 0 6px rgba(255,255,255,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .heat-scale { display: flex; justify-content: space-between; max-width: 250px; margin: 3px auto 0; font-size: 9.5px; color: var(--ink-soft); letter-spacing: .6px; }
  .gps-tip { font-size: 11px; color: var(--ink-soft); background: rgba(212,171,92,.14); border-left: 3px solid var(--brass); padding: 7px 10px; border-radius: 3px; margin: 10px 0 0; text-align: left; line-height: 1.35; }

  .riddle-parchment { background: #fcf8ee; border: 1px dashed rgba(43,29,14,.35); padding: 12px; border-radius: 4px; margin-bottom: 10px; font-size: 13px; text-align: left; line-height: 1.4; }
  
  .maze-svg-wrap { margin: 10px 0; text-align: center; border: 2px solid var(--brass); border-radius: 4px; background: #f5ecc7; padding: 4px; box-shadow: inset 0 0 10px rgba(43,29,14,.1); }
  
  /* CARTE */
  .carte-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; font-size: 12px; color: var(--ink-soft); }
  .carte-head strong { font-family: 'IM Fell English SC', serif; font-size: 16px; color: var(--wine); }
  .map-frame { border-radius: var(--radius-md); overflow: hidden; border: 1px solid rgba(43,29,14,.45); box-shadow: var(--shadow-md); background: #241709; line-height: 0; }
  .map-frame svg { display: block; width: 100%; height: auto; }
  .carte-info { margin-top: 12px; padding: 12px 14px; background: #fffdf6; border: 1px solid rgba(43,29,14,.2); border-left: 5px solid var(--brass); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
  #carte-info-title { font-family: 'IM Fell English SC', serif; font-size: 17px; color: var(--ink); }
  #carte-info-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.4; }
  .carte-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(43,29,14,.28); background: #fffdf6; border-radius: 999px; padding: 4px 11px 4px 4px; font-family: inherit; font-size: 11px; color: var(--ink); cursor: pointer; box-shadow: var(--shadow-sm); transition: all .15s var(--ease); }
  .chip-n { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass)); font-family: 'IM Fell English SC', serif; font-size: 11px; color: var(--ink); }
  .chip.active { border-color: var(--wine); background: #fbeee6; }
  .chip-more { padding: 4px 11px; color: var(--slate); border-style: dashed; cursor: default; box-shadow: none; background: transparent; }
  .pin { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pin.selected .pin-ring { opacity: 1; }
  .pin-new { animation: pin-drop .65s var(--ease) both; }
  .trail-new { opacity: 0; animation: soft-in .7s ease forwards; }
  #fog-layer { transition: opacity 2.6s ease; }
  #carte-complete { transition: opacity 1.4s ease 1.4s; }
  @keyframes pin-drop { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes soft-in { from { opacity: 0; } to { opacity: 1; } }

  /* CONFETTIS DE VICTOIRE */
  .confetti-piece { position: fixed; top: -20px; width: 9px; height: 14px; z-index: 400; pointer-events: none; animation: confetti-fall linear forwards; border-radius: 2px; }

  /* CANVAS CACHÉ POUR LA COMPRESSION */
  #resize-canvas { display: none; }
</style>
</head>
<body>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw93vfV2-3SW1bYJHEP_3NpXX8_O1MUJYF_YHzBnsj82FBmjJghvenZjUll1dQDgfLjIw/exec";

    const BARS_DATA = [
        { id: 1, name: "Café du Théâtre", spec: "Cocktail maison" },
        { id: 2, name: "La Tour Solidor", spec: "Bière d'abbaye / Trappiste" },

        { id: 8, name: "Les Mauvais Gamins", spec: "Embuscade / Cocktail" }
    ];

    const TARGET_COORDS = { lat: 49.174139, lng: -0.357083 };

    const MAZE_COLS = 7, MAZE_ROWS = 9, MAZE_SEED = 20260916;
    function seededRandom(seed) {
        let s = seed % 2147483647; if (s <= 0) s += 2147483646;
        return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    }
    function shuffleWithRng(arr, rng) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
        return a;
    }
    function generateMaze(cols, rows, seed) {
        const rng = seededRandom(seed);
        const grid = [];
        for (let r = 0; r < rows; r++) { const row = []; for (let c = 0; c < cols; c++) row.push({ N: true, S: true, E: true, W: true, v: false }); grid.push(row); }
        const opp = { N: 'S', S: 'N', E: 'W', W: 'E' };
        (function carve(r, c) {
            grid[r][c].v = true;
            for (const d of shuffleWithRng(['N', 'S', 'E', 'W'], rng)) {
                let nr = r, nc = c;
                if (d === 'N') nr--; else if (d === 'S') nr++; else if (d === 'E') nc++; else nc--;
                if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || grid[nr][nc].v) continue;
                grid[r][c][d] = false; grid[nr][nc][opp[d]] = false;
                carve(nr, nc);
            }
        })(0, 0);
        return grid;
    }
    const MAZE_GRID = generateMaze(MAZE_COLS, MAZE_ROWS, MAZE_SEED);

    // Emplacements sur la carte stylisée (positions relatives approximatives, pas des GPS exacts).
    // lx/ly/a = position et ancrage de l'étiquette du sceau.
    const BAR_MAP_POINTS = {
        1: { x: 150, y: 318, lx: 134, ly: 321, a: 'end' },
        2: { x: 138, y: 216, lx: 122, ly: 219, a: 'end' },

        5: { x: 206, y: 176, lx: 220, ly: 168, a: 'start' },

        7: { x: 212, y: 330, lx: 228, ly: 349, a: 'end' },
        8: { x: 162, y: 246, lx: 176, ly: 249, a: 'start' }
    };
    const CARTE_HOLE_R = 86;
    let carteSeenStep = 0, carteAnimId = null, carteSelected = null, carteLastStep = 0;

    let currentGlobalStep = 1;
    let activeBarIdForRiddle = null;
    let selectedBarForDrink = null;
    let base64Photo = null, mimeType = null, fileName = null;

    let mazeAnimId = null, mazeGamma = 0, mazeBeta = 0;
    let px = 15, py = 15;
    const mazeKeys = {};

    let geoWatchId = null, lastLat = null, lastLng = null, lastHeading = null, compassActive = false, needleRotation = 0, roseRotation = 0, lastVibe = 0, gpsFallbackTimer = null;
    let adminClicks = 0, adminTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedName = localStorage.getItem('barathon_participant');
        if (savedName) document.getElementById('global-participant').value = savedName;
        verifierFileAttenteHorsLigne();
        verifierConnexionReseau();
        setInterval(verifierConnexionReseau, 10000);
    });

    function sauvegarderParticipant() {
        const name = document.getElementById('global-participant').value;
        if (name) localStorage.setItem('barathon_participant', name);
    }

    function showToast(text, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        const icon = document.createElement('span');
        icon.className = 'toast-icon';
        icon.textContent = type === 'good' ? '\u2713' : type === 'bad' ? '!' : 'i';
        const label = document.createElement('span');
        label.textContent = text;
        toast.appendChild(icon); toast.appendChild(label);
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('leaving'); }, 3200);
        setTimeout(() => { toast.remove(); }, 3500);
    }

    function showModal(id) {
        const m = document.getElementById(id);
        if (!m) return;
        m.style.display = 'flex';
        requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('is-open')));
    }

    function hideModal(id) {
        const m = document.getElementById(id);
        if (!m || m.style.display !== 'flex') return;
        m.classList.remove('is-open');
        setTimeout(() => { if (!m.classList.contains('is-open')) m.style.display = 'none'; }, 300);
    }

    function lancerConfettis() {
        const colors = ['#a9822d', '#d4ab5c', '#7a2333', '#3e5b44', '#f8f1dc'];
        for (let i = 0; i < 40; i++) {
            const c = document.createElement('div');
            c.className = 'confetti-piece';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = colors[i % colors.length];
            c.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
            c.style.animationDelay = (Math.random() * 0.8) + 's';
            c.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 6000);
        }
    }

    function verifierConnexionReseau() {
        const banner = document.getElementById('net-banner');
        if (navigator.onLine) {
            banner.className = 'net-online';
            banner.textContent = "⚡ Réseau opérationnel - Synchronisé";
            setTimeout(() => { banner.style.display = 'none'; }, 2000);
            verifierFileAttenteHorsLigne();
        } else {
            banner.className = 'net-offline';
            banner.textContent = "⚓ Mode Hors-ligne actif - Les données sont stockées localement";
            banner.style.display = 'block';
        }
    }

    function gererClicAdmin() {

            if (stepNum >= 1 && stepNum <= 8) {

    async function fetchGameState() {
        try {
            const res = await fetch(WEB_APP_URL + "?action=get_state");
            const data = await res.json();
            if (data.currentStep && data.currentStep > currentGlobalStep) {
                currentGlobalStep = data.currentStep;
                renderBars();
                renderCarte();
                if (currentGlobalStep >= BARS_DATA.length) declencherVictoire();
            } else if (!document.getElementById("bars-list").innerHTML.includes("waypoint")) {
                renderBars();
                renderCarte();
            }

            const list = document.getElementById("bars-list");
            if (!list.innerHTML.includes("waypoint")) renderBars();
        }
    }

        if (lt) lt.textContent = `Étape ${done} / ${total}`;
        if (lp) lp.textContent = `${pct} %`;

                container.innerHTML += `<div class="waypoint open" style="animation-delay:${delay}ms" onclick="ouvrirValidationBoisson(${bar.id})">

                    container.innerHTML += `<div class="unlock-call" style="animation-delay:${delay}ms" onclick="ouvrirEnigme(${prochainId})">

    function renderCarte() {
        const holesG = document.getElementById("fog-holes");
        const pinsG = document.getElementById("carte-pins");
        const trailG = document.getElementById("carte-trail");
        if (!holesG || !pinsG || !trailG) return;

        const total = BARS_DATA.length;
        const step = Math.max(0, Math.min(currentGlobalStep, total));
        const tab = document.getElementById("tab-carte");
        const visible = !!tab && tab.classList.contains("active");
        const fromStep = visible ? Math.min(carteSeenStep, step) : step;
        const newIds = [];
        for (let id = fromStep + 1; id <= step; id++) newIds.push(id);

        if (carteAnimId) { cancelAnimationFrame(carteAnimId); carteAnimId = null; }
        if (step > carteLastStep || carteSelected === null || carteSelected > step) carteSelected = step || null;
        carteLastStep = step;

        const fog = document.getElementById("fog-layer");
        const banner = document.getElementById("carte-complete");
        if (visible && newIds.length && fog) {
            fog.style.transition = "none"; fog.style.opacity = "1"; void fog.getBoundingClientRect(); fog.style.transition = "";
            if (banner) { banner.style.transition = "none"; banner.style.opacity = "0"; void banner.getBoundingClientRect(); banner.style.transition = ""; }
        }

        let holes = "", trail = "", pins = "";
        for (let id = 1; id <= step; id++) {
            const p = BAR_MAP_POINTS[id], bar = BARS_DATA[id - 1];
            if (!p || !bar) continue;
            const isNew = newIds.indexOf(id) !== -1;
            const delay = isNew ? (id - fromStep - 1) * 450 + 500 : 0;
            const latest = id === step;
            const selected = id === carteSelected;

            holes += `<circle id="hole-${id}" cx="${p.x}" cy="${p.y}" r="${isNew ? 0 : CARTE_HOLE_R}" fill="url(#mHole)"></circle>`;

            if (id > 1) {
                const a = BAR_MAP_POINTS[id - 1];
                const dx = p.x - a.x, dy = p.y - a.y, len = Math.hypot(dx, dy) || 1;
                const off = (id % 2 === 0 ? 1 : -1) * Math.min(26, len * 0.22);
                const cx = ((a.x + p.x) / 2 - dy / len * off).toFixed(1), cy = ((a.y + p.y) / 2 + dx / len * off).toFixed(1);
                const d = `M${a.x} ${a.y} Q${cx} ${cy} ${p.x} ${p.y}`;
                trail += `<g class="${isNew ? "trail-new" : ""}" style="${isNew ? `animation-delay:${delay + 300}ms` : ""}">
                    <path d="${d}" fill="none" stroke="#f2e6c8" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 7"></path>
                    <path d="${d}" fill="none" stroke="#7a2333" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 7"></path></g>`;
            }

            pins += `<g class="pin${isNew ? " pin-new" : ""}${selected ? " selected" : ""}" id="pin-${id}" style="${isNew ? `animation-delay:${delay}ms` : ""}" onclick="selectCartePin(${id})">
                <ellipse cx="${p.x}" cy="${p.y + 11}" rx="9" ry="2.8" fill="#000" opacity=".3"></ellipse>
                <circle cx="${p.x}" cy="${p.y}" r="21" fill="#fff" fill-opacity="0.001"></circle>
                <circle class="pin-ring" cx="${p.x}" cy="${p.y}" r="16.5" fill="none" stroke="#7a2333" stroke-width="1.7" stroke-dasharray="3.2 3" opacity="0"></circle>
                ${latest ? `<circle cx="${p.x}" cy="${p.y}" r="12" fill="none" stroke="#7a2333" stroke-width="1.6" opacity=".7"><animate attributeName="r" values="12;27" dur="2s" repeatCount="indefinite"></animate><animate attributeName="opacity" values=".75;0" dur="2s" repeatCount="indefinite"></animate></circle>` : ""}
                <circle cx="${p.x}" cy="${p.y}" r="11.5" fill="url(#${latest ? "mSealHot" : "mSeal"})" stroke="#2b1d0e" stroke-width="1.3"></circle>
                <circle cx="${p.x}" cy="${p.y}" r="8" fill="none" stroke="#2b1d0e" stroke-opacity=".35" stroke-width=".8"></circle>
                <text x="${p.x}" y="${p.y + 3.9}" text-anchor="middle" font-size="11" font-family="'IM Fell English SC', Georgia, serif" fill="${latest ? "#fdf3dc" : "#2b1d0e"}">${id}</text>
                <text x="${p.lx}" y="${p.ly}" text-anchor="${p.a}" font-size="8.8" font-style="italic" font-family="'IM Fell English SC', Georgia, serif" fill="#2b1d0e" stroke="#f2e6c8" stroke-width="2.8" paint-order="stroke">${bar.name}</text>
            </g>`;
        }
        holesG.innerHTML = holes;
        trailG.innerHTML = trail;
        pinsG.innerHTML = pins;

        const count = document.getElementById("carte-count");
        if (count) count.textContent = `${step} / ${total}`;
        renderCarteLegend(step, total);
        updateCarteInfo();

        if (newIds.length) animateCarteHoles(newIds, step, visible);
        else carteFinish(step, visible);
    }

    function animateCarteHoles(newIds, step, visible) {
        const t0 = performance.now(), dur = 1200, stagger = 450;
        function frame(now) {
            let done = true;
            newIds.forEach((id, i) => {
                const p = Math.min(1, Math.max(0, (now - t0 - i * stagger) / dur));
                const e = 1 - Math.pow(1 - p, 3);
                const el = document.getElementById("hole-" + id);
                if (el) el.setAttribute("r", (CARTE_HOLE_R * e).toFixed(1));
                if (p < 1) done = false;
            });
            if (done) { carteAnimId = null; carteFinish(step, visible); }
            else carteAnimId = requestAnimationFrame(frame);
        }
        carteAnimId = requestAnimationFrame(frame);
    }

    function carteFinish(step, visible) {
        if (visible) carteSeenStep = step;
        const complete = step >= BARS_DATA.length;
        const fog = document.getElementById("fog-layer");
        const banner = document.getElementById("carte-complete");
        if (fog) fog.style.opacity = complete ? "0" : "1";
        if (banner) banner.style.opacity = complete ? "1" : "0";
    }

    function renderCarteLegend(step, total) {
        const el = document.getElementById("carte-legend");
        if (!el) return;
        let html = "";
        for (let id = 1; id <= step; id++) {
            html += `<button class="chip" data-id="${id}" onclick="selectCartePin(${id})"><span class="chip-n">${id}</span>${BARS_DATA[id - 1].name}</button>`;
        }
        if (step < total) html += `<span class="chip chip-more">+ ${total - step} terre${total - step > 1 ? "s" : ""} inconnue${total - step > 1 ? "s" : ""}</span>`;
        el.innerHTML = html;
    }

    function selectCartePin(id) {
        const step = Math.min(currentGlobalStep, BARS_DATA.length);
        if (id < 1 || id > step) return;
        carteSelected = id;
        document.querySelectorAll("#carte-pins .pin").forEach(g => g.classList.toggle("selected", g.id === "pin-" + id));

    }

    function verifierReponse() {
        let ans = document.getElementById("ans") ? document.getElementById("ans").value.toLowerCase().trim() : "";
        let msg = document.getElementById("riddle-msg");

        if (activeBarIdForRiddle === 2 && ans === "tour solidor") ok = true;
        if (activeBarIdForRiddle === 3 && (ans.includes("pelican") || ans.includes("pélican"))) ok = true;
        if (activeBarIdForRiddle === 4) {
            if (ans.length !== 9) { msg.textContent = "Il faut exactement 9 lettres."; msg.className = "feedback feedback-bad"; if (navigator.vibrate) navigator.vibrate(100); return; }
            if (ans.toUpperCase() === "PIRATERIE") ok = true;
            else {
                let row = `<div class="motus-grid">`;
                let sec = "PIRATERIE".split("");
                ans.toUpperCase().split("").forEach((l, i) => {
                    let stat = "m-absent";
                    if (l === sec[i]) stat = "m-correct"; else if (sec.includes(l)) stat = "m-present";
                    row += `<div class="motus-tile ${stat}">${l}</div>`;
                });
                row += `</div>`;
                document.getElementById("motus-histo").innerHTML = row;
                msg.textContent = "Mot incorrect — observe les lettres bien placées.";
                msg.className = "feedback feedback-bad";
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

            msg.textContent = "Mauvaise réponse…";
            msg.className = "feedback feedback-bad";

    }

    function buildMazeSVG() {
        const cs = 30;
        let svg = `<svg viewBox="0 0 ${MAZE_COLS * cs} ${MAZE_ROWS * cs}" width="100%" height="${Math.min(240, MAZE_ROWS * cs)}" style="max-height:240px;background:#f5ecc7;">`;
        for (let r = 0; r < MAZE_ROWS; r++) {
            for (let c = 0; c < MAZE_COLS; c++) {
                const cell = MAZE_GRID[r][c], x = c * cs, y = r * cs;
                if (cell.N) svg += `<line x1="${x}" y1="${y}" x2="${x + cs}" y2="${y}" stroke="#5b4632" stroke-width="2.5" stroke-linecap="round"></line>`;
                if (cell.W) svg += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + cs}" stroke="#5b4632" stroke-width="2.5" stroke-linecap="round"></line>`;
            }
        }
        for (let c = 0; c < MAZE_COLS; c++) { if (MAZE_GRID[MAZE_ROWS - 1][c].S) svg += `<line x1="${c * cs}" y1="${MAZE_ROWS * cs}" x2="${(c + 1) * cs}" y2="${MAZE_ROWS * cs}" stroke="#5b4632" stroke-width="2.5" stroke-linecap="round"></line>`; }
        for (let r = 0; r < MAZE_ROWS; r++) { if (MAZE_GRID[r][MAZE_COLS - 1].E) svg += `<line x1="${MAZE_COLS * cs}" y1="${r * cs}" x2="${MAZE_COLS * cs}" y2="${(r + 1) * cs}" stroke="#5b4632" stroke-width="2.5" stroke-linecap="round"></line>`; }
        svg += `<text x="${cs / 2}" y="${cs / 2 + 5}" font-size="14" text-anchor="middle">🏁</text>`;
        svg += `<text x="${(MAZE_COLS - 0.5) * cs}" y="${(MAZE_ROWS - 0.5) * cs + 6}" font-size="16" text-anchor="middle">💰</text>`;
        svg += `<g id="pirate-token" transform="translate(15,15)"><text font-size="16" text-anchor="middle" dy="5">🏴‍☠️</text></g>`;
        svg += `</svg>`;
        return svg;
    }

    function demarrerLabyrinthe() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(res => {
                if (res === 'granted') window.addEventListener('deviceorientation', handleMazeOrientation);
            }).catch(() => {});
        } else { window.addEventListener('deviceorientation', handleMazeOrientation); }
        const btn = document.getElementById("btn-maze");
        if (btn) btn.style.display = "none";
    }

    function handleMazeOrientation(event) {
        if (activeBarIdForRiddle !== 5) return;
        mazeGamma = event.gamma || 0;
        mazeBeta = event.beta || 0;
    }

    function handleMazeKeydown(event) {
        if (activeBarIdForRiddle !== 5) return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
            event.preventDefault();
            mazeKeys[event.key] = true;
        }
    }

    function handleMazeKeyup(event) {
        if (activeBarIdForRiddle !== 5) return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
            mazeKeys[event.key] = false;
        }
    }

    function startSmoothMazeLoop() {
        if (mazeAnimId) cancelAnimationFrame(mazeAnimId);
        function loop() {
            if (activeBarIdForRiddle !== 5) return;
            const cs = 30, radius = 7, speed = 1.8;
            let vx = 0, vy = 0;
            const THRESH = 4;
            if (Math.abs(mazeGamma) > THRESH) vx = (mazeGamma / 30) * speed;
            if (Math.abs(mazeBeta) > THRESH) vy = (mazeBeta / 30) * speed;
            if (mazeKeys['ArrowLeft']) vx = speed;
            if (mazeKeys['ArrowRight']) vx = -speed;
            if (mazeKeys['ArrowUp']) vy = speed;
            if (mazeKeys['ArrowDown']) vy = -speed;

            if (vx !== 0 || vy !== 0) {
                let nextPx = px + vx;
                let curC = Math.floor(px / cs), curR = Math.floor(py / cs);
                let targetC = Math.floor(nextPx / cs);
                if (nextPx - radius >= 0 && nextPx + radius <= MAZE_COLS * cs) {
                    if (targetC !== curC) {
                        let cell = MAZE_GRID[curR][curC];
                        if (targetC > curC && !cell.E) px = nextPx;
                        else if (targetC < curC && !cell.W) px = nextPx;
                    } else { px = nextPx; }
                }

                let nextPy = py + vy;
                curC = Math.floor(px / cs); curR = Math.floor(py / cs);
                let targetR = Math.floor(nextPy / cs);
                if (nextPy - radius >= 0 && nextPy + radius <= MAZE_ROWS * cs) {
                    if (targetR !== curR) {
                        let cell = MAZE_GRID[curR][curC];
                        if (targetR > curR && !cell.S) py = nextPy;
                        else if (targetR < curR && !cell.N) py = nextPy;
                    } else { py = nextPy; }
                }

                const token = document.getElementById("pirate-token");
                if (token) token.setAttribute("transform", `translate(${px},${py})`);

                let finalC = Math.floor(px / cs);
                let finalR = Math.floor(py / cs);
                if (finalR === MAZE_ROWS - 1 && finalC === MAZE_COLS - 1) {
                    cancelAnimationFrame(mazeAnimId);
                    mazeAnimId = null;
                    const hint = document.getElementById("maze-hint");
                    if (hint) { hint.textContent = "Le trésor est à toi !"; hint.className = "feedback feedback-good"; }
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    unlockGlobalStep();
                    return;
                }
            }
            mazeAnimId = requestAnimationFrame(loop);
        }
        mazeAnimId = requestAnimationFrame(loop);
    }

    function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function bearingTo(lat1, lon1, lat2, lon2) {
        const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
        const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
        const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function buildCompassSVG() {
        const cx = 130, cy = 130, F = "'IM Fell English SC', Georgia, serif";
        const pt = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
        let ticks = "", nums = "", rivets = "";
        for (let a = 0; a < 360; a += 5) {
            const major = a % 30 === 0, mid = a % 10 === 0;
            const p1 = pt(99, a), p2 = pt(major ? 87 : mid ? 92.5 : 95.5, a);
            ticks += `<line x1="${p1[0].toFixed(2)}" y1="${p1[1].toFixed(2)}" x2="${p2[0].toFixed(2)}" y2="${p2[1].toFixed(2)}" stroke="#3a2a17" stroke-width="${major ? 1.7 : 0.8}" opacity="${major ? 1 : 0.65}"></line>`;
            if (major && a % 90 !== 0) { const t = pt(78, a); nums += `<text x="${t[0].toFixed(1)}" y="${(t[1] + 2.3).toFixed(1)}" text-anchor="middle" font-size="6.6" fill="#5b4632" font-family="'Special Elite', monospace">${a}</text>`; }
        }
        for (let a = 15; a < 360; a += 30) { const r = pt(120, a); rivets += `<circle cx="${r[0].toFixed(1)}" cy="${r[1].toFixed(1)}" r="2.5" fill="url(#cHub)" stroke="#3a2808" stroke-width=".7"></circle>`; }
        const half = (len, w, rot, c1, c2) => `<g transform="rotate(${rot} ${cx} ${cy})"><path d="M${cx} ${cy - len} L${cx + w} ${cy - w} L${cx} ${cy} Z" fill="${c1}" stroke="#3a2a17" stroke-width=".7"></path><path d="M${cx} ${cy - len} L${cx - w} ${cy - w} L${cx} ${cy} Z" fill="${c2}" stroke="#3a2a17" stroke-width=".7"></path></g>`;
        let star = "";
        [45, 135, 225, 315].forEach(r => { star += half(40, 6, r, "#a9822d", "#f4e8c8"); });
        [0, 90, 180, 270].forEach(r => { star += half(58, 9, r, "#5b2a1c", "#f4e8c8"); });
        return `<svg viewBox="0 0 260 260" role="img" aria-label="Boussole du corsaire">
          <defs>
            <linearGradient id="cBezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e5a8"></stop><stop offset=".28" stop-color="#c99c3f"></stop><stop offset=".52" stop-color="#7b5619"></stop><stop offset=".78" stop-color="#e4c36e"></stop><stop offset="1" stop-color="#9a7227"></stop></linearGradient>
            <radialGradient id="cDial" cx="50%" cy="46%" r="62%"><stop offset="0" stop-color="#fcf3da"></stop><stop offset=".75" stop-color="#ecd7a4"></stop><stop offset="1" stop-color="#d4b87c"></stop></radialGradient>
            <linearGradient id="cGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"></stop><stop offset=".55" stop-color="#fff" stop-opacity=".07"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
            <linearGradient id="cNeedle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bf4f64"></stop><stop offset=".5" stop-color="#7a2333"></stop><stop offset="1" stop-color="#4a1020"></stop></linearGradient>
            <radialGradient id="cHub" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff0b8"></stop><stop offset=".5" stop-color="#cfa447"></stop><stop offset="1" stop-color="#7a561a"></stop></radialGradient>
            <radialGradient id="cJewel" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f08aa0"></stop><stop offset=".55" stop-color="#7a2333"></stop><stop offset="1" stop-color="#3a0f18"></stop></radialGradient>
            <linearGradient id="cSweepG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4ab5c" stop-opacity="0"></stop><stop offset="1" stop-color="#d4ab5c" stop-opacity=".8"></stop></linearGradient>
            <clipPath id="cDialClip"><circle cx="130" cy="130" r="104.5"></circle></clipPath>
          </defs>
          <circle cx="130" cy="130" r="127" fill="url(#cBezel)" stroke="#3a2808" stroke-width="1.6"></circle>
          <circle cx="130" cy="130" r="123" fill="none" stroke="#fbe9ae" stroke-opacity=".5" stroke-width="1"></circle>
          ${rivets}
          <circle cx="130" cy="130" r="113" fill="#2a1d0e" stroke="#5a3f10" stroke-width="1.2"></circle>
          <circle cx="130" cy="130" r="108.5" fill="url(#cBezel)" stroke="#3a2808" stroke-width="1"></circle>
          <circle cx="130" cy="130" r="104.5" fill="url(#cDial)" stroke="#6b5030" stroke-width="1.2"></circle>
          <g clip-path="url(#cDialClip)">
            <g id="compass-rose">
              <circle cx="130" cy="130" r="100" fill="none" stroke="#5b4632" stroke-width=".9"></circle>
              <circle cx="130" cy="130" r="64" fill="none" stroke="#a9822d" stroke-width=".8" stroke-dasharray="2 3"></circle>
              <circle cx="130" cy="130" r="26" fill="none" stroke="#5b4632" stroke-width=".7"></circle>
              ${ticks}${nums}${star}
              <path d="M130 44 L134 51 L130 58 L126 51 Z" fill="#7a2333" stroke="#3a0f18" stroke-width=".6"></path>
              <text x="130" y="76" text-anchor="middle" font-size="15" fill="#7a2333" font-family="${F}" font-weight="bold">N</text>
              <text x="193" y="135" text-anchor="middle" font-size="14" fill="#3a2a17" font-family="${F}">E</text>
              <text x="130" y="198" text-anchor="middle" font-size="14" fill="#3a2a17" font-family="${F}">S</text>
              <text x="67" y="135" text-anchor="middle" font-size="14" fill="#3a2a17" font-family="${F}">O</text>
            </g>
            <g id="compass-sweep"><path d="M130 130 L130 30 A100 100 0 0 1 200 58.6 Z" fill="url(#cSweepG)"></path></g>
            <ellipse cx="94" cy="76" rx="64" ry="30" transform="rotate(-34 94 76)" fill="url(#cGlass)"></ellipse>
          </g>
          <circle cx="130" cy="130" r="103" fill="none" stroke="#2a1d0e" stroke-opacity=".28" stroke-width="3.5"></circle>
          <g id="compass-needle"><g class="needle-wobble">
            <path d="M133 34 L144 134 L133 128 L122 134 Z" fill="#000" opacity=".18"></path>
            <path d="M130 30 L140 130 L130 123 L120 130 Z" fill="url(#cNeedle)" stroke="#2e0c14" stroke-width="1.1" stroke-linejoin="round"></path>
            <path d="M130 34 L130 120" stroke="#f2a9b8" stroke-opacity=".55" stroke-width="1"></path>
            <path d="M130 196 L138 130 L130 137 L122 130 Z" fill="#dcc88f" stroke="#3a2a17" stroke-width="1" stroke-linejoin="round"></path>
            <circle cx="130" cy="34" r="7" fill="url(#cHub)" stroke="#3a2808" stroke-width="1.2"></circle>
            <path d="M126.4 30.4 L133.6 37.6 M133.6 30.4 L126.4 37.6" stroke="#7a2333" stroke-width="1.9" stroke-linecap="round"></path>
          </g></g>
          <circle cx="130" cy="130" r="12.5" fill="url(#cHub)" stroke="#3a2808" stroke-width="1.3"></circle>
          <circle cx="130" cy="130" r="6" fill="url(#cJewel)" stroke="#2e0c14" stroke-width=".8"></circle>
          <circle cx="128" cy="128" r="1.6" fill="#fff" opacity=".7"></circle>
        </svg>`;
    }

    function buildHeatSegments() {
        const colors = ["#7fa6b5", "#8fb0a8", "#a3b98f", "#c3c273", "#d9bb56", "#dfa33f", "#d9822f", "#cc5f2f", "#b93c33", "#8f1f2e"];
        return colors.map(c => `<i style="background:${c}"></i>`).join("");
    }

    function setCompassStatus(text, kind) {
        const m = document.getElementById("compass-msg");
        if (m) { m.textContent = text; m.className = "feedback feedback-" + kind; }
    }

    function demarrerBoussole() {
        if (!navigator.geolocation) { setCompassStatus("Géolocalisation indisponible sur cet appareil.", "warn"); return; }
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(res => {
                if (res === 'granted') window.addEventListener('deviceorientation', handleCompassOrientation);
            }).catch(() => {});
        } else { window.addEventListener('deviceorientation', handleCompassOrientation); }

        geoWatchId = navigator.geolocation.watchPosition(updateCompassPosition, geoErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
        compassActive = true;
        const inst = document.getElementById("compass-instrument"), btn = document.getElementById("btn-compass");
        if (inst) { inst.classList.remove("standby"); inst.classList.add("active"); }
        if (btn) btn.style.display = "none";
        const lab = document.getElementById("ro-label");
        if (lab) lab.textContent = "Recherche du signal";
        setCompassStatus("Acquisition du signal GPS…", "info");

        gpsFallbackTimer = setTimeout(() => {
            if (lastLat == null) {
                const fc = document.getElementById("gps-fallback-container");
                if (fc) fc.innerHTML = `<p class="gps-tip">Signal lent ? Place-toi à découvert, loin des hauts murs, et patiente quelques secondes.</p>`;
            }
        }, 8000);
    }

    function updateCompassPosition(pos) {
        lastLat = pos.coords.latitude; lastLng = pos.coords.longitude;
        if (gpsFallbackTimer) clearTimeout(gpsFallbackTimer);
        const fc = document.getElementById("gps-fallback-container");
        if (fc) fc.innerHTML = "";
        const lab = document.getElementById("ro-label");
        if (lab) lab.textContent = "Distance de la cache";
        refreshCompassUI();
    }

    function geoErr(err) {
        if (err && err.code === 1) setCompassStatus("Localisation refusée : autorise-la dans les réglages du navigateur.", "bad");
        else setCompassStatus("Signal GPS faible — place-toi à découvert.", "warn");
    }

    function smoothAngle(prev, next, alpha) {
        if (prev == null) return next;
        const diff = ((next - prev + 540) % 360) - 180;
        return (prev + alpha * diff + 360) % 360;
    }

    function setNeedleRotation(targetDeg) {
        const needle = document.getElementById("compass-needle");
        if (!needle) return;
        const current = ((needleRotation % 360) + 360) % 360;
        const delta = ((targetDeg - current + 540) % 360) - 180;
        needleRotation += delta;
        needle.style.transform = `rotate(${needleRotation}deg)`;
    }

    function setRoseRotation(targetDeg) {
        const rose = document.getElementById("compass-rose");
        if (!rose) return;
        const current = ((roseRotation % 360) + 360) % 360;
        const delta = ((targetDeg - current + 540) % 360) - 180;
        roseRotation += delta;
        rose.style.transform = `rotate(${roseRotation}deg)`;
    }

    function handleCompassOrientation(event) {
        const heading = (typeof event.webkitCompassHeading === 'number') ? event.webkitCompassHeading : (event.alpha != null ? (360 - event.alpha) : null);
        if (heading != null) lastHeading = smoothAngle(lastHeading, heading, 0.3);
        refreshCompassUI();
    }

    function refreshCompassUI() {
        if (activeBarIdForRiddle !== 2 || !compassActive) return;
        const inst = document.getElementById("compass-instrument");
        if (!inst) return;
        if (lastHeading != null) setRoseRotation((360 - lastHeading) % 360);
        if (lastLat == null) { setCompassStatus("Acquisition du signal GPS…", "info"); return; }

        const dist = haversineDistance(lastLat, lastLng, TARGET_COORDS.lat, TARGET_COORDS.lng);
        const brg = bearingTo(lastLat, lastLng, TARGET_COORDS.lat, TARGET_COORDS.lng);
        setNeedleRotation(lastHeading != null ? (brg - lastHeading + 360) % 360 : brg);

        const heat = dist <= 5 ? 3 : dist <= 15 ? 2 : dist <= 30 ? 1 : 0;
        inst.dataset.heat = String(heat);

        const val = document.getElementById("ro-digits"), unit = document.getElementById("ro-unit");
        if (val) val.textContent = dist >= 1000 ? (dist / 1000).toFixed(1) : String(Math.round(dist));
        if (unit) unit.textContent = dist >= 1000 ? "km" : "m";

        const lit = Math.round(Math.max(0, Math.min(1, (120 - dist) / 115)) * 10);
        document.querySelectorAll("#heat-meter i").forEach((el, i) => el.classList.toggle("lit", i < lit));

        const texts = ["Suis l'aiguille, la cache t'attend quelque part…", "Tu t'approches de la zone critique…", "Ça brûle ! Fouille les environs.", "Tu y es presque — ouvre l'œil !"];
        setCompassStatus(texts[heat], heat === 0 ? "info" : heat === 3 ? "good" : "warn");

        const now = Date.now();
        if (heat >= 2 && navigator.vibrate && now - lastVibe > 4000) { lastVibe = now; navigator.vibrate([100, 50, 100]); }
    }

    async function unlockGlobalStep() {
        const p = document.getElementById("global-participant").value;
        const payload = { action: "resolve_riddle", step: activeBarIdForRiddle, participant: p };
        try {
            const res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
            const data = await res.json();
            if (data.status === "success" || data.status === "already_unlocked") {
                showToast(`${p} a validé l'étape ! (+20 pts)`, "good");
                fermerModales(); fetchGameState();
            }
        } catch (error) {
            stockerHorsLigne(payload);
            currentGlobalStep = Math.min(BARS_DATA.length, activeBarIdForRiddle + 1);
            showToast("Hors-ligne : étape validée sur le carnet !", "info");
            fermerModales(); renderBars(); renderCarte();
        }
    }

    function ouvrirValidationBoisson(barId) {
        const p = document.getElementById("global-participant").value;
        if (!p) { showToast("Choisis d'abord ton nom, en haut du carnet !", "bad"); return; }
        selectedBarForDrink = BARS_DATA.find(b => b.id === barId);
        document.getElementById("drink-bar-title").textContent = `Consommation : ${selectedBarForDrink.name}`;
        document.getElementById("drink-photo").value = ""; base64Photo = null;
        showModal("modal-drink");
    }

    // Compression d'image automatique via Canvas
    document.getElementById('drink-photo').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        mimeType = file.type || "image/jpeg";
        fileName = file.name || "preuve.jpg";

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('resize-canvas');
                const ctx = canvas.getContext('2d');
                let width = img.width;
                let height = img.height;
                const MAX_WIDTH = 900;
                const MAX_HEIGHT = 900;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                base64Photo = dataUrl.split(',')[1];
                showToast("Preuve photo compressée avec succès.", "good");
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    async function envoyerBoisson() {
        if (!base64Photo) { showToast("Il manque la preuve en image !", "bad"); return; }
        const p = document.getElementById("global-participant").value;
        const verre = document.getElementById("drink-select").value;
        const btn = document.getElementById("btn-submit-drink");

        let points = 10;
        if (verre === selectedBarForDrink.spec) points += 5;

        const payload = { action: "validate_drink", participant: p, bar: selectedBarForDrink.name, verre: verre, points: points, photoBase64: base64Photo, mimeType: mimeType, fileName: fileName };

        btn.disabled = true; btn.textContent = "Envoi…";
        try {
            await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
            showToast("Conso enregistrée avec succès !", "good");
            fermerModales(); switchTab('scores');
        } catch (error) {
            stockerHorsLigne(payload);
            showToast("Réseau indisponible : conso stockée localement.", "info");
            fermerModales(); switchTab('scores');
        }
        btn.disabled = false; btn.textContent = "Envoyer la preuve (+10 pts)";
    }

    function stockerHorsLigne(payload) {
        let queue = JSON.parse(localStorage.getItem('barathon_offline_queue') || '[]');
        queue.push(payload);
        localStorage.setItem('barathon_offline_queue', JSON.stringify(queue));
    }

    async function verifierFileAttenteHorsLigne() {
        let queue = JSON.parse(localStorage.getItem('barathon_offline_queue') || '[]');
        if (queue.length === 0) return;
        try {
            for (let payload of queue) {
                await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
            }
            localStorage.removeItem('barathon_offline_queue');
            showToast("Données hors-ligne synchronisées avec succès !", "good");
        } catch (e) {
            console.log("Toujours hors-ligne, synchro reportée.");
        }
    }

    function declencherVictoire() {
        if (!window.victoireAffichee) {
            window.victoireAffichee = true;
            const c = document.getElementById("riddle-content");
            document.getElementById("riddle-title").textContent = "🏆 Le Pacte des Corsaires";
            c.innerHTML = `<div class="riddle-parchment" style="text-align:center;">
                             <strong>FÉLICITATIONS !</strong><br><br>
                             Toutes les tavernes de Caen ont été convoitées. Le trésor suprême est atteint, l'équipage est légendaire !
                           </div>`;
            showModal("modal-riddle");
            lancerConfettis();
        }
    }

    function fermerModales() {
        hideModal("modal-riddle");
        hideModal("modal-drink");

        if (mazeAnimId) { cancelAnimationFrame(mazeAnimId); mazeAnimId = null; }
        window.removeEventListener('deviceorientation', handleMazeOrientation);
        window.removeEventListener('keydown', handleMazeKeydown);
        window.removeEventListener('keyup', handleMazeKeyup);
        px = 15; py = 15; mazeGamma = 0; mazeBeta = 0;

        if (geoWatchId != null) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; }
        if (gpsFallbackTimer) clearTimeout(gpsFallbackTimer);
        window.removeEventListener('deviceorientation', handleCompassOrientation);
        compassActive = false; lastLat = null; lastLng = null; lastHeading = null; needleRotation = 0; roseRotation = 0;
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        const idx = tab === 'accueil' ? 0 : tab === 'scores' ? 1 : 2;
        document.querySelectorAll('.tab-btn')[idx].classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
        if (tab === 'scores') chargerClassement();
        if (tab === 'carte') renderCarte();
    }

    async function chargerClassement() {
        const tbody = document.getElementById('ranking-body'); 
        tbody.innerHTML = `<tr><td colspan="3" style="padding:16px;"><div class="skeleton-line" style="width:60%;margin:0 auto;"></div></td></tr>`;
        try {
            const res = await fetch(WEB_APP_URL + "?action=classement"); 
            const data = await res.json(); 
            tbody.innerHTML = "";
            data.forEach((row, i) => {
                let rang = i === 0 ? '<span class="medal medal-gold">I</span>' : i === 1 ? '<span class="medal medal-silver">II</span>' : i === 2 ? '<span class="medal medal-bronze">III</span>' : `#${i + 1}`;
                tbody.innerHTML += `<tr><td>${rang}</td><td><b>${row.participant}</b></td><td>${row.points} pts</td></tr>`;
            });
        } catch (e) { 
            tbody.innerHTML = `<tr><td colspan="3">Mode hors-ligne actif<br><button class="btn btn-ghost" onclick="chargerClassement()">Réessayer</button></td></tr>`; 
        }
    }
</script>
